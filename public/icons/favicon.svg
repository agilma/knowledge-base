<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Knowledge Base">
  <!-- Favicon. An SVG rather than a PNG so the mark can follow the browser's
       light or dark chrome instead of being baked to one colour. -->
  <style>
    .mark { fill: #171717; }
    @media (prefers-color-scheme: dark) { .mark { fill: #fafafa; } }
  </style>
  <g class="mark">
    <rect x="8" y="8" width="11" height="48" rx="5.5"/>
    <rect x="25" y="13" width="31" height="9" rx="4.5"/>
    <rect x="25" y="27.5" width="31" height="9" rx="4.5"/>
    <rect x="25" y="42" width="20" height="9" rx="4.5"/>
  </g>
</svg>
